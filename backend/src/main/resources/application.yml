server:
  port: 8080

spring:
  datasource:
    url: ${FAK_DB_URL:jdbc:h2:file:./data/fak;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${FAK_DB_USER:sa}
    password: ${FAK_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

fak:
  policy-path: classpath:configs/policies.yml
# Logging – show constraint evaluations at DEBUG level
logging:
  level:
    com.fak: DEBUG
